<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Topología DHCP con dos LAN conectadas a un router Cisco</title>
  <desc id="desc">Router Cisco conectado a dos switches, uno para 172.16.0.0/16 y otro para 192.168.1.0/24.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b43"/><stop offset="1" stop-color="#1b4965"/></linearGradient>
    <linearGradient id="router" y2="1"><stop stop-color="#c8f2f6"/><stop offset="1" stop-color="#82d9e3"/></linearGradient>
    <linearGradient id="switch" y2="1"><stop stop-color="#e4f7d9"/><stop offset="1" stop-color="#bfe5aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#071a2a" flood-opacity=".28"/></filter>
    <style>
      .h1{fill:#f8fbff;font:700 34px Arial,sans-serif}.kicker{fill:#6ce0ea;font:700 14px Arial,sans-serif;letter-spacing:2px}.sub{fill:#c8d8e6;font:19px Arial,sans-serif}.a{fill:#edfaff;stroke:#74d2df;stroke-width:2}.b{fill:#f0faec;stroke:#9ed38d;stroke-width:2}.device{stroke:#1d3851;stroke-width:3;filter:url(#shadow)}.label{fill:#173047;font:700 19px Arial,sans-serif;text-anchor:middle}.detail{fill:#527083;font:15px Arial,sans-serif;text-anchor:middle}.caption{fill:#ffffff;font:700 19px Arial,sans-serif;text-anchor:middle}.caption-detail{fill:#c8d8e6;font:15px Arial,sans-serif;text-anchor:middle}.net-a{fill:#126d7a;font:700 21px Arial,sans-serif;text-anchor:middle}.net-b{fill:#397139;font:700 21px Arial,sans-serif;text-anchor:middle}.link-a{fill:none;stroke:#26b4c5;stroke-width:7;stroke-linecap:round}.link-b{fill:none;stroke:#65ae54;stroke-width:7;stroke-linecap:round}.port-a{fill:#d7fbff;font:700 14px Arial,sans-serif;text-anchor:middle}.port-b{fill:#dff6d8;font:700 14px Arial,sans-serif;text-anchor:middle}.card{fill:#fff;opacity:.9}.card-title{fill:#173047;font:700 16px Arial,sans-serif;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text class="kicker" x="70" y="57">ESCENARIO 02 · AMPLIACIÓN DEL SERVICIO</text>
  <text class="h1" x="70" y="101">Un router DHCP, dos redes independientes</text>
  <text class="sub" x="70" y="132">Cada interfaz usa una subred, una puerta de enlace y un pool propios.</text>
